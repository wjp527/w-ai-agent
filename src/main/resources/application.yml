spring:
  application:
    name : w-ai-agent
  profiles:
    active: local
  ai:
    mcp:
      client:
        # sse 模式
        sse:
          connections:
            server1:
              url: http://localhost:8127
              sse-endpoint: /sse
        # stdio模式
#        stdio:
#          servers-configuration: classpath:mcp-servers.json

server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi?? ???? ??
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wjp.waiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn